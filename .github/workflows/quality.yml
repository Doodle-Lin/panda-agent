name: Quality Gate

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create a named verification branch
        run: git switch -C ci/pr-${{ github.event.pull_request.number }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Verify collaboration and quality gates
        run: python scripts/harness.py verify
