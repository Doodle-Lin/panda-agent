[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-agent"
version = "0.2.0"
description = "Self-Evolving Agent Framework — CLI + TUI + 3-Agent Loop + Graph Memory"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "pyyaml>=6.0",
    # Format-preserving CST rewriting for patch application. Required, not
    # optional: patching is the core mechanism, and the regex fallback it
    # replaced silently corrupted files.
    "libcst>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
panda = "panda_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
