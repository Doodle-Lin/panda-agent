[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-agent"
version = "0.2.0"
description = "Self-Evolving Agent Framework — CLI + TUI + 3-Agent Loop + Graph Memory"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["agent", "self-evolving", "llm", "code-generation", "graph-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "pyyaml>=6.0",
    "libcst>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0", "twine>=5.0"]

[project.scripts]
panda = "panda_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Doodle-Lin/panda-agent"
Repository = "https://github.com/Doodle-Lin/panda-agent"
Issues = "https://github.com/Doodle-Lin/panda-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line too long — handled by formatting, not lint

[tool.ruff.lint.per-file-ignores]
# Scripts and tests bootstrap sys.path before importing the package, which
# legitimately requires imports after a statement.
"scripts/run_experiment.py" = ["E402"]
"scripts/observe_evolution.py" = ["E402"]
"tests/test_run_experiment.py" = ["E402"]
